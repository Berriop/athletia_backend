sonar.projectKey=Berriop_athletia_backend
sonar.organization=berriop

sonar.sources=src
sonar.tests=src/__tests__
# src/__tests__/** tiene que quedar excluido de sonar.sources: si no, Sonar lo
# indexa a la vez como codigo fuente (por sonar.sources=src) y como codigo de
# prueba (por sonar.tests), y el analisis falla con "can't be indexed twice".
sonar.exclusions=node_modules/**,dist/**,coverage/**,src/__tests__/**

# Ruta al reporte de cobertura que genera vitest (npm run test:coverage)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# El equipo solo escribio pruebas para las 24 funcionalidades (RF) que se estan
# trabajando, no para todo el backend. Sin esto, el % de cobertura que muestra
# SonarCloud queda diluido por rutas/controladores/middlewares/repositorios y
# por los demas casos de uso (Get*, etc.) que nunca tuvieron pruebas porque no
# son parte de las 24 RF. Esto NO saca esos archivos del analisis de calidad
# (bugs, code smells, duplicacion siguen viendose) - solo los excluye del
# calculo de cobertura, para que el % refleje unicamente las 24 RF.
# Actualizado: se agregaron 4 RF nuevos (18, 22, 25, 30) que tocan
# SearchGymsUseCase, admin.middleware y los casos de uso de admin/* -
# ya tienen pruebas propias, por eso salen de esta lista.
sonar.coverage.exclusions=\
  src/server.ts,\
  src/config/**,\
  src/domain/**,\
  src/infrastructure/**,\
  src/interface/controllers/**,\
  src/interface/routes/**,\
  src/interface/helpers/**,\
  src/interface/middlewares/auth.middleware.ts,\
  src/interface/middlewares/error.middleware.ts,\
  src/interface/middlewares/validation.middleware.ts,\
  src/interface/middlewares/role.middleware.ts,\
  src/application/dto/**,\
  src/application/use-cases/GetMeUseCase.ts,\
  src/application/use-cases/VerifyEmailUseCase.ts,\
  src/application/use-cases/gym/NearbyGymsUseCase.ts,\
  src/application/use-cases/injury/GetInjuriesUseCase.ts,\
  src/application/use-cases/injury/GetInjuryByIdUseCase.ts,\
  src/application/use-cases/meal/GetMealByIdUseCase.ts,\
  src/application/use-cases/meal/GetMealsUseCase.ts,\
  src/application/use-cases/sleep/GetSleepByIdUseCase.ts,\
  src/application/use-cases/sleep/GetSleepsUseCase.ts,\
  src/application/use-cases/workout/GetWorkoutByIdUseCase.ts,\
  src/application/use-cases/workout/GetWorkoutsUseCase.ts
