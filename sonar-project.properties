# Reemplaza estos dos valores con los tuyos reales de SonarCloud
# (los ves en sonarcloud.io -> tu proyecto -> Information, o en la URL del proyecto)
sonar.projectKey=9263999ed9b6a068074b093fdaf34ede3c8f07eb
sonar.organization=berriop

sonar.sources=src
sonar.tests=src/__tests__
sonar.exclusions=node_modules/**,dist/**,coverage/**

# Ruta al reporte de cobertura que genera vitest (npm run test:coverage)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# El equipo solo escribio pruebas para las 20 funcionalidades (RF) que se estan
# trabajando, no para todo el backend. Sin esto, el % de cobertura que muestra
# SonarCloud queda diluido por rutas/controladores/middlewares/repositorios y
# por los demas casos de uso (Get*, admin, gym) que nunca tuvieron pruebas
# porque no son parte de las 20 RF. Esto NO saca esos archivos del analisis de
# calidad (bugs, code smells, duplicacion siguen viendose) - solo los excluye
# del calculo de cobertura, para que el % refleje unicamente las 20 RF.
sonar.coverage.exclusions=\
  src/server.ts,\
  src/config/**,\
  src/domain/**,\
  src/infrastructure/**,\
  src/interface/**,\
  src/application/dto/**,\
  src/application/use-cases/GetMeUseCase.ts,\
  src/application/use-cases/VerifyEmailUseCase.ts,\
  src/application/use-cases/admin/**,\
  src/application/use-cases/gym/**,\
  src/application/use-cases/injury/GetInjuriesUseCase.ts,\
  src/application/use-cases/injury/GetInjuryByIdUseCase.ts,\
  src/application/use-cases/meal/GetMealByIdUseCase.ts,\
  src/application/use-cases/meal/GetMealsUseCase.ts,\
  src/application/use-cases/sleep/GetSleepByIdUseCase.ts,\
  src/application/use-cases/sleep/GetSleepsUseCase.ts,\
  src/application/use-cases/workout/GetWorkoutByIdUseCase.ts,\
  src/application/use-cases/workout/GetWorkoutsUseCase.ts
